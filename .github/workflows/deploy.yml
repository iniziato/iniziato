name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 142.93.160.178
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd /var/www/iniziato

            # Backup .env before pull
            cp .env /tmp/iniziato.env.bak

            # Pull latest code (reset any local changes)
            git checkout -- .
            git clean -fd
            git pull origin main

            # Restore .env
            cp /tmp/iniziato.env.bak .env

            # Install dependencies
            npm install

            # Generate Prisma client
            npx prisma generate

            # Run migrations
            npx prisma migrate deploy

            # Build Next.js
            npm run build

            # Restart with PM2
            pm2 describe iniziato > /dev/null 2>&1 && pm2 restart iniziato || pm2 start npm --name "iniziato" -- start
            pm2 save
