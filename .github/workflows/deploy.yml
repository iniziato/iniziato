name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 209.38.203.94
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /var/www/iniziato

            # Backup .env before pull
            cp .env /tmp/iniziato.env.bak

            # Pull latest code (reset any local changes)
            git checkout -- .
            git clean -fd
            git pull origin main

            # Restore .env
            cp /tmp/iniziato.env.bak .env

            # Install dependencies
            npm install

            # Generate Prisma client
            npx prisma generate

            # Run migrations (don't fail deploy on permission errors when schema is unchanged)
            npx prisma migrate deploy || echo "WARN: prisma migrate deploy failed — continuing"

            # Build Next.js (clean .next first so a half-finished build can't ship)
            rm -rf .next
            npm run build
            test -f .next/BUILD_ID

            # Restart with PM2 (delete first to avoid duplicate processes)
            pm2 delete iniziato 2>/dev/null || true
            pm2 start npm --name "iniziato" -- start
            pm2 save
